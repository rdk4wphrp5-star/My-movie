<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينيما ديسكورد الخاصة 🎬</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0b0b;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .video-box {
            position: relative;
            width: 95%;
            max-width: 800px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* زر التشغيل المخصص للآيفون والموبايل */
        #customPlayBtn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.85);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #error-log {
            color: #ff5555;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="video-box">
        <!-- زر تشغيل مخصص يظهر فوق الفيديو ليحل مشكلة عدم الاستجابة على الآيفون -->
        <button id="customPlayBtn" onclick="playVideo()">تشغيل الفيلم 🎬</button>
        
        <video id="moviePlayer" playsinline webkit-playsinline preload="auto">
            <source src="https://pub-f5cff3f81d2545699fe2aea565870e82.r2.dev/Movies/sample-5s.mp4" type="video/mp4">
            متصفحك لا يدعم عرض الفيديو.
        </video>
    </div>
    
    <div id="error-log"></div>

    <!-- ديسكورد SDK وفايربيس للمزامنة -->
    <script type="module">
        import { DiscordSDK } from "https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.0.0/+esm";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

        const video = document.getElementById("moviePlayer");
        const playBtn = document.getElementById("customPlayBtn");
        const errorLog = document.getElementById("error-log");

        // دالة التشغيل عند الضغط على الزر المخصص
        window.playVideo = function() {
            video.play().then(() => {
                playBtn.style.display = "none"; // إخفاء الزر بعد التشغيل
                video.controls = true; // إظهار أزرار التحكم الطبيعية بعد ما يشتغل
            }).catch((err) => {
                errorLog.innerText = "خطأ في التشغيل: " + err.message;
            });
        };

        video.onerror = function() {
            const err = video.error;
            errorLog.innerText = "خطأ في تحميل الفيديو (كود: " + (err ? err.code : "غير معروف") + ")";
        };

        // تفعيل ديسكورد SDK
        const discordSdk = new DiscordSDK('1563244164106293421');
        discordSdk.ready().catch(() => {});

        // إعدادات فايربيس للمزامنة
        const firebaseConfig = {
            apiKey: "AIzaSyAkpD64rIo7YPMLfHHy_ILjveWh8ZAfFYY",
            authDomain: "discord-movie-3dabc.firebaseapp.com",
            projectId: "discord-movie-3dabc",
            storageBucket: "discord-movie-3dabc.firebasestorage.app",
            messagingSenderId: "548090739512",
            appId: "1:548090739512:web:e796bf7ddd946dc57f5fcd",
            measurementId: "G-YG7EGNY17Z"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let isRemoteUpdate = false;

        onValue(ref(db, "room/state"), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            isRemoteUpdate = true;
            if (Math.abs(video.currentTime - data.time) > 1.5) {
                video.currentTime = data.time;
            }

            if (data.playing && video.paused) {
                video.play().then(() => { playBtn.style.display = "none"; video.controls = true; }).catch(() => {});
            } else if (!data.playing && !video.paused) {
                video.pause();
            }

            setTimeout(() => { isRemoteUpdate = false; }, 500);
        });

        video.onplay = () => {
            playBtn.style.display = "none";
            video.controls = true;
            if (isRemoteUpdate) return;
            set(ref(db, "room/state"), { playing: true, time: video.currentTime });
        };

        video.onpause = () => {
            if (isRemoteUpdate) return;
            set(ref(db, "room/state"), { playing: false, time: video.currentTime });
        };
    </script>
</body>
</html>
