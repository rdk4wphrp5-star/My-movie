<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سينيما ديسكورد الخاصة 🎬</title>
    <style>
        body { background: #111; color: white; text-align: center; font-family: sans-serif; padding-top: 20px; }
        #player { border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: inline-block; }
        p { color: #aaa; font-size: 14px; }
    </style>
</head>
<body>
    <h1>قاعة الأفلام الخاصة بي 🍿</h1>
    <p>جاري الاتصال بقاعة ديسكورد...</p>
    
    <!-- مكان مشغل يوتيوب -->
    <div id="player"></div>

    <!-- استدعاء مكتبات ديسكورد، يوتيوب، و فايربيس -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module">
        import { DiscordSDK } from "https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.0.0/+esm";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

        // 1. تفعيل ديسكورد SDK بالـ Client ID الخاص بك
        const discordSdk = new DiscordSDK('1563244164106293421');

        async function initDiscord() {
            await discordSdk.ready();
            console.log("Discord SDK Ready!");
        }
        initDiscord();

        // 2. إعدادات فايربيس للمزامنة
        const firebaseConfig = {
            apiKey: "AIzaSyAkpD64rIo7YPMLfHHy_ILjveWh8ZAfFYY",
            authDomain: "discord-movie-3dabc.firebaseapp.com",
            projectId: "discord-movie-3dabc",
            storageBucket: "discord-movie-3dabc.firebasestorage.app",
            messagingSenderId: "548090739512",
            appId: "1:548090739512:web:e796bf7ddd946dc57f5fcd",
            measurementId: "G-YG7EGNY17Z"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let player;
        let isRemoteUpdate = false;

        // 3. تشغيل يوتيوب
        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('player', {
                height: '360',
                width: '640',
                videoId: 'Aab-jcNrYbU', // فيديو الفيلم بتاعك
                playerVars: { 'playsinline': 1 },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        };

        function onPlayerStateChange(event) {
            if (isRemoteUpdate) return;
            const currentTime = player.getCurrentTime();
            if (event.data == YT.PlayerState.PLAYING) {
                set(ref(db, "room/state"), { playing: true, time: currentTime });
            } else if (event.data == YT.PlayerState.PAUSED) {
                set(ref(db, "room/state"), { playing: false, time: currentTime });
            }
        }

        onValue(ref(db, "room/state"), (snapshot) => {
            const data = snapshot.val();
            if (!data || !player || typeof player.getPlayerState !== 'function') return;

            isRemoteUpdate = true;
            const currentTime = player.getCurrentTime();
            if (Math.abs(currentTime - data.time) > 2) {
                player.seekTo(data.time, true);
            }

            if (data.playing && player.getPlayerState() !== YT.PlayerState.PLAYING) {
                player.playVideo();
            } else if (!data.playing && player.getPlayerState() !== YT.PlayerState.PAUSED) {
                player.pauseVideo();
            }

            setTimeout(() => { isRemoteUpdate = false; }, 600);
        });
    </script>
</body>
</html>
