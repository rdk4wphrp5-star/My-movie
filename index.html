<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينيما ديسكورد الاحترافية 🎬</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0d0d;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        h1 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #f1f1f1;
        }
        /* حاوية الفيديو لتملأ شاشة الأكتيفتي باحترافية زي الصورة */
        #video-container {
            width: 90%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>قاعة الأفلام المشتركة 🍿</h1>

    <!-- مشغل الفيديو المتوافق مع ديسكورد -->
    <div id="video-container">
        <iframe src="https://www.youtube.com/embed/Aab-jcNrYbU?autoplay=1&enablejsapi=1&playsinline=1" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
        </iframe>
    </div>

    <!-- تفعيل ديسكورد SDK لتظهر الأكتيفتي بشكل نظامي -->
    <script type="module">
        import { DiscordSDK } from "https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.0.0/+esm";

        const discordSdk = new DiscordSDK('1563244164106293421');

        async function setup() {
            try {
                await discordSdk.ready();
                console.log("Discord SDK Initialized successfully!");
            } catch (error) {
                console.error("SDK initialization error:", error);
            }
        }
        setup();
    </script>
</body>
</html>
